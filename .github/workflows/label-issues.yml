# Applies seq:, platform: and type: labels from the issue form answers.
name: Label issues from form

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            // Return the answer under a "### <heading>" section of the issue form.
            const section = (heading) => {
              const re = new RegExp(`###\\s+${heading}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s|$)`);
              const m = body.match(re);
              return m ? m[1].split(",").map(s => s.trim()).filter(Boolean) : [];
            };

            const map = {
              "neuropoly_gre_advshim": "seq:neuropoly_gre_advshim",
              "neuropoly_ep2d_bold_advshim": "seq:neuropoly_ep2d_bold_advshim",
              "XA60": "platform:XA60",
              "XA61B": "platform:XA61B",
              "Bug report": "type:bug",
              "Question": "type:question",
              "Feature request": "type:feature",
            };

            const answers = [...section("Type"), ...section("Sequence"), ...section("Platform")];
            const wanted = answers.map(a => map[a]).filter(Boolean);
            const managed = Object.values(map);

            const current = context.payload.issue.labels.map(l => l.name);
            const toAdd = wanted.filter(l => !current.includes(l));
            const toRemove = current.filter(l => managed.includes(l) && !wanted.includes(l));

            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number };
            if (toAdd.length) await github.rest.issues.addLabels({ ...issue, labels: toAdd });
            for (const name of toRemove) await github.rest.issues.removeLabel({ ...issue, name });
            core.info(`Added: ${toAdd.join(", ") || "none"} | Removed: ${toRemove.join(", ") || "none"}`);
